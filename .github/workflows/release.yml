name: Release

# A push to master whose package.json version has no tag yet is a release: test, push the image
# ghcr.io/n1ck145/ficsmap:<version>, :<major.minor> and :latest, then create the tag v<version> and a
# GitHub Release with the version's CHANGELOG section. A push without a new version releases nothing.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # tag + GitHub Release
      packages: write # ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.v.outputs.new == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.v.outputs.new == 'true'
        run: npm ci
      - name: Check version and CHANGELOG, write release notes
        if: steps.v.outputs.new == 'true'
        run: |
          npx tsx scripts/release.ts check "$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          npx tsx scripts/release.ts notes > "$RUNNER_TEMP/notes.md"
      - if: steps.v.outputs.new == 'true'
        run: npm run typecheck && npm test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.v.outputs.new == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.v.outputs.new == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.v.outputs.new == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/n1ck145/ficsmap:${{ steps.v.outputs.version }}
            ghcr.io/n1ck145/ficsmap:${{ steps.v.outputs.minor }}
            ghcr.io/n1ck145/ficsmap:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag and GitHub Release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "ficsmap v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
